[project]
name = "order-inventory-api"
version = "0.1.0"
description = "Portfolio demo: transactional orders and inventory with FastAPI and SQLite"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
